<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Apple Intelligence Liquid Glow</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #02060d;
      position: relative;
      user-select: none;
    }

    /* Screen Canvas for Liquid Audio Sine Waves */
    #glowCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      filter: blur(12px) drop-shadow(0 0 25px rgba(0, 243, 255, 0.85)) drop-shadow(0 0 50px rgba(255, 0, 127, 0.65));
    }

    /* Crisp Secondary Canvas for High-Precision Perimeter Highlights */
    #sharpCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Minimal floating status pill in top-right */
    .status-badge {
      position: fixed;
      top: 20px;
      right: 28px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
      background: rgba(10, 15, 30, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      padding: 6px 14px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
      z-index: 100;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00f3ff;
      box-shadow: 0 0 10px #00f3ff;
      animation: pulseDot 1.4s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.4; }
    }
  </style>
</head>
<body>
  <canvas id="glowCanvas"></canvas>
  <canvas id="sharpCanvas"></canvas>

  <div class="status-badge">
    <div class="pulse-dot"></div>
    <span>STACKY // SIRI FLUID ENGINE</span>
  </div>

  <script>
    const glowCanvas = document.getElementById("glowCanvas");
    const sharpCanvas = document.getElementById("sharpCanvas");
    const gCtx = glowCanvas.getContext("2d");
    const sCtx = sharpCanvas.getContext("2d");

    let width, height;
    function resize() {
      width = glowCanvas.width = sharpCanvas.width = window.innerWidth;
      height = glowCanvas.height = sharpCanvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // Apple Intelligence Spectral Colors
    const palette = [
      { r: 0, g: 243, b: 255 },    // Electric Cyan
      { r: 0, g: 112, b: 243 },    // Deep Blue
      { r: 157, g: 78, b: 221 },   // Violet
      { r: 255, g: 0, b: 127 },    // Magenta
      { r: 255, g: 170, b: 0 }     // Sunset Amber
    ];

    let t = 0;

    function render() {
      t += 0.025;
      gCtx.clearRect(0, 0, width, height);
      sCtx.clearRect(0, 0, width, height);

      // Draw 4 undulating liquid border edges (Top, Right, Bottom, Left)
      drawLiquidBorder(gCtx, 36, 0.85); // Soft diffused background layer
      drawLiquidBorder(sCtx, 6, 1.0);   // Crisp luminous ribbon line

      requestAnimationFrame(render);
    }

    function drawLiquidBorder(ctx, baseThickness, alphaMult) {
      // Create continuous gradient around the perimeter
      const grad = ctx.createLinearGradient(0, 0, width, height);
      grad.addColorStop(0.0, "rgba(0, 243, 255, 0.95)");
      grad.addColorStop(0.25, "rgba(157, 78, 221, 0.95)");
      grad.addColorStop(0.5, "rgba(255, 0, 127, 0.95)");
      grad.addColorStop(0.75, "rgba(255, 170, 0, 0.95)");
      grad.addColorStop(1.0, "rgba(0, 243, 255, 0.95)");

      ctx.fillStyle = grad;
      ctx.strokeStyle = grad;
      ctx.lineWidth = baseThickness;

      // TOP BORDER
      ctx.beginPath();
      ctx.moveTo(0, 0);
      for (let x = 0; x <= width; x += 15) {
        // Multi-frequency organic sine wave
        const wave = Math.sin(x * 0.008 + t * 2) * 14 + Math.sin(x * 0.02 - t * 3) * 6;
        const y = baseThickness + Math.abs(wave);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(width, 0);
      ctx.closePath();
      ctx.fill();

      // BOTTOM BORDER
      ctx.beginPath();
      ctx.moveTo(0, height);
      for (let x = 0; x <= width; x += 15) {
        const wave = Math.sin(x * 0.007 - t * 2.5) * 14 + Math.cos(x * 0.015 + t) * 6;
        const y = height - (baseThickness + Math.abs(wave));
        ctx.lineTo(x, y);
      }
      ctx.lineTo(width, height);
      ctx.closePath();
      ctx.fill();

      // LEFT BORDER
      ctx.beginPath();
      ctx.moveTo(0, 0);
      for (let y = 0; y <= height; y += 15) {
        const wave = Math.sin(y * 0.009 + t * 2.2) * 14 + Math.sin(y * 0.018 - t) * 5;
        const x = baseThickness + Math.abs(wave);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(0, height);
      ctx.closePath();
      ctx.fill();

      // RIGHT BORDER
      ctx.beginPath();
      ctx.moveTo(width, 0);
      for (let y = 0; y <= height; y += 15) {
        const wave = Math.sin(y * 0.008 - t * 2.8) * 14 + Math.cos(y * 0.02 + t * 1.5) * 5;
        const x = width - (baseThickness + Math.abs(wave));
        ctx.lineTo(x, y);
      }
      ctx.lineTo(width, height);
      ctx.closePath();
      ctx.fill();
    }

    render();
  </script>
</body>
</html>
