<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stacky Screen Perimeter Glow</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
      pointer-events: none;
      user-select: none;
    }

    /* Outer Perimeter Laser Glow */
    .glow-perimeter {
      position: fixed;
      inset: 0;
      border: 4px solid transparent;
      border-radius: 20px;
      /* Animated continuous flowing neon gradient */
      background: 
        linear-gradient(#0000 0 0) padding-box,
        linear-gradient(var(--angle, 0deg), #00f3ff, #0066ff, #00ffc8, #ff9d00, #ff0055, #00f3ff) border-box;
      filter: drop-shadow(0 0 14px rgba(0, 243, 255, 0.85)) drop-shadow(0 0 35px rgba(0, 243, 255, 0.45));
      animation: rotateGlow 3.5s linear infinite, breathPulse 2s ease-in-out infinite alternate;
    }

    /* Inner subtle particle line */
    .inner-trace {
      position: fixed;
      inset: 6px;
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 16px;
      opacity: 0.6;
    }

    /* Corner Micro-Status Indicator */
    .status-badge {
      position: fixed;
      top: 18px;
      right: 28px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #00f3ff;
      text-shadow: 0 0 10px #00f3ff;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 15, 35, 0.65);
      backdrop-filter: blur(12px);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(0, 243, 255, 0.35);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 10px #00ff88;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }

    @property --angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    @keyframes rotateGlow {
      to {
        --angle: 360deg;
      }
    }

    @keyframes breathPulse {
      0% {
        border-width: 3.5px;
        filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.7)) drop-shadow(0 0 25px rgba(0, 150, 255, 0.3));
      }
      100% {
        border-width: 5.5px;
        filter: drop-shadow(0 0 22px rgba(0, 243, 255, 0.95)) drop-shadow(0 0 45px rgba(0, 243, 255, 0.6));
      }
    }
  </style>
</head>
<body>
  <div class="glow-perimeter"></div>
  <div class="inner-trace"></div>
  <div class="status-badge">
    <div class="pulse-dot"></div>
    <span>STACKY // ACTIVE</span>
  </div>
</body>
</html>
