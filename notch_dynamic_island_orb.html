<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stacky AI — Dynamic Notch Island Presence</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #04060d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      user-select: none;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      z-index: 10;
    }
    .badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 999px;
      background: rgba(0, 242, 254, 0.12);
      border: 1px solid rgba(0, 242, 254, 0.35);
      color: #00f2fe;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 30px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 40%, #00f2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    p {
      color: #8fa0b5;
      font-size: 13px;
    }

    /* MAC SCREEN MOCKUP */
    .mac-screen {
      position: relative;
      width: 960px;
      height: 560px;
      border-radius: 20px;
      background: #080d1a url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
      box-shadow: 0 30px 80px rgba(0,0,0,0.85), 0 0 0 1px rgba(255, 255, 255, 0.14);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Menu bar */
    .mac-menubar {
      height: 30px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(25px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      z-index: 50;
    }
    .menu-left { display: flex; gap: 16px; align-items: center; }
    .menu-right { display: flex; gap: 14px; align-items: center; }

    /* ======================================================== */
    /* PURE DYNAMIC NOTCH ISLAND (JUST THE GLOBE, ZERO TEXT)     */
    /* ======================================================== */
    .notch-anchor {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* The morphing pill container */
    .notch-island {
      position: relative;
      width: 150px;
      height: 28px;
      background: #000;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    /* Idle camera hole inside notch */
    .notch-camera-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #111;
      border: 1px solid #222;
      transition: opacity 0.3s ease;
    }

    /* Fluid Glowing Outer Edge when active */
    .notch-island::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.4), rgba(121, 40, 202, 0.35), rgba(255, 8, 68, 0.35));
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
      z-index: 1;
    }

    /* THE EXPANDED STATE (PURE GLOBE EMERGENCE) */
    .notch-island.active {
      width: 110px;
      height: 110px;
      border-radius: 55px;
      top: 10px;
      background: #000000;
      border: 1px solid rgba(0, 242, 254, 0.35);
      box-shadow: 
        0 15px 45px rgba(0,0,0,0.9),
        0 0 35px rgba(0, 242, 254, 0.25),
        0 0 60px rgba(121, 40, 202, 0.15);
    }

    .notch-island.active::before {
      opacity: 1;
    }

    .notch-island.active .notch-camera-dot {
      opacity: 0;
      display: none;
    }

    /* THE GLOBE CONTAINER INSIDE ISLAND */
    .island-globe-wrapper {
      position: relative;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .notch-island.active .island-globe-wrapper {
      display: flex;
      animation: globePop 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes globePop {
      0% { transform: scale(0.3) translateY(-20px); opacity: 0; }
      70% { transform: scale(1.08) translateY(2px); opacity: 1; }
      100% { transform: scale(1.0) translateY(0); opacity: 1; }
    }

    /* Fluid Breathing Orb Image */
    .island-globe-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,0.8)) saturate(1.2);
      animation: islandFluidBreath 3.2s infinite ease-in-out alternate;
    }

    /* Dynamic Fluid Aura behind globe */
    .island-globe-aura {
      position: absolute;
      width: 105px;
      height: 105px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.55) 0%, rgba(121, 40, 202, 0.4) 45%, rgba(255, 8, 68, 0.25) 75%, transparent 85%);
      filter: blur(14px);
      z-index: -1;
      animation: islandAuraBreath 3.2s infinite ease-in-out alternate;
    }

    @keyframes islandFluidBreath {
      0% {
        transform: scale(0.95) rotate(-2deg);
        filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.5)) saturate(1.15);
      }
      50% {
        transform: scale(1.06) rotate(2deg);
        filter: drop-shadow(0 0 25px rgba(255, 8, 68, 0.7)) saturate(1.4) brightness(1.12);
      }
      100% {
        transform: scale(0.98) rotate(0deg);
        filter: drop-shadow(0 0 20px rgba(121, 40, 202, 0.6)) saturate(1.25);
      }
    }

    @keyframes islandAuraBreath {
      0% { transform: scale(0.85); opacity: 0.55; }
      50% { transform: scale(1.3); opacity: 0.95; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }

    /* Ambient Desktop Mock Content */
    .mock-code-window {
      position: absolute;
      top: 100px;
      left: 60px;
      width: 480px;
      height: 310px;
      background: rgba(13, 18, 30, 0.7);
      backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.6);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
      opacity: 0.75;
    }
    .w-dots { display: flex; gap: 6px; }
    .w-dot { width: 10px; height: 10px; border-radius: 50%; }
    .w-r { background: #ff5f56; }
    .w-y { background: #ffbd2e; }
    .w-g { background: #27c93f; }
    .mock-lines { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .m-line { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.1); }

    /* macOS Dock */
    .mac-dock {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      height: 54px;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(35px);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 40;
    }
    .dock-app {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }

    /* CONTROLS DOCK */
    .controls-bar {
      margin-top: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 10;
    }
    .btn-toggle {
      background: rgba(0, 242, 254, 0.15);
      border: 1px solid rgba(0, 242, 254, 0.4);
      color: #00f2fe;
      padding: 10px 24px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
    }
    .btn-toggle:hover {
      background: rgba(0, 242, 254, 0.25);
      transform: translateY(-2px);
    }

    .key-hint {
      font-size: 12px;
      color: #64748b;
    }
    kbd {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 2px 6px;
      font-family: monospace;
      color: #e2e8f0;
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">Pure Notch Emergence</div>
    <h1>Stacky AI Dynamic Island</h1>
    <p>Zero text, zero clutter — the camera notch fluidly morphs open revealing only the breathing colored globe.</p>
  </header>

  <!-- MAC SCREEN MOCKUP -->
  <div class="mac-screen">
    
    <!-- Top Menu Bar -->
    <div class="mac-menubar">
      <div class="menu-left">
        <span></span>
        <span>Finder</span>
        <span>File</span>
        <span>Edit</span>
        <span>View</span>
        <span>Go</span>
        <span>Window</span>
        <span>Help</span>
      </div>
      <div class="menu-right">
        <span>WiFi</span>
        <span>100%</span>
        <span>Thu 12:20 PM</span>
      </div>
    </div>

    <!-- DYNAMIC ISLAND AT CAMERA NOTCH -->
    <div class="notch-anchor">
      <div class="notch-island active" id="notchIsland" onclick="toggleIsland()" title="Click to summon / dismiss">
        <div class="notch-camera-dot"></div>
        <div class="island-globe-wrapper">
          <div class="island-globe-aura"></div>
          <img src="assets/stacky_globe_improved.png" alt="Stacky Core Globe" class="island-globe-img" />
        </div>
      </div>
    </div>

    <!-- Simulated Desktop Window -->
    <div class="mock-code-window">
      <div class="w-dots">
        <div class="w-dot w-r"></div>
        <div class="w-dot w-y"></div>
        <div class="w-dot w-g"></div>
      </div>
      <div class="mock-lines">
        <div class="m-line" style="width: 45%;"></div>
        <div class="m-line" style="width: 80%;"></div>
        <div class="m-line" style="width: 65%;"></div>
        <div class="m-line" style="width: 90%;"></div>
        <div class="m-line" style="width: 30%;"></div>
      </div>
    </div>

    <!-- macOS Dock -->
    <div class="mac-dock">
      <div class="dock-app">📁</div>
      <div class="dock-app">🌐</div>
      <div class="dock-app">✉️</div>
      <div class="dock-app">💬</div>
      <div class="dock-app">⚙️</div>
    </div>
  </div>

  <!-- INTERACTIVE TOGGLE CONTROLS -->
  <div class="controls-bar">
    <button class="btn-toggle" onclick="toggleIsland()">
      <span id="btnText">Dismiss to Notch (Idle)</span>
    </button>
    <div class="key-hint">Press <kbd>Spacebar</kbd> or click the notch to toggle emergence</div>
  </div>

  <script>
    const island = document.getElementById('notchIsland');
    const btnText = document.getElementById('btnText');

    function toggleIsland() {
      island.classList.toggle('active');
      const isActive = island.classList.contains('active');
      btnText.textContent = isActive ? 'Dismiss to Notch (Idle)' : 'Summon Globe from Notch';
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        toggleIsland();
      }
    });
  </script>
</body>
</html>
