<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stacky Living Voice Orb</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 50%, #071329 0%, #02060f 60%, #000206 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      user-select: none;
    }

    /* Ambient fluid glow behind globe */
    .ambient-glow {
      position: absolute;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 243, 255, 0.45) 0%, rgba(255, 0, 127, 0.35) 45%, rgba(255, 170, 0, 0.15) 75%, transparent 100%);
      filter: blur(55px);
      animation: ambientPulse 3.5s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .orb-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Outer Prismatic Ring */
    .prismatic-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: conic-gradient(from var(--angle, 0deg), #00f3ff, #9d4edd, #ff007f, #ffaa00, #00f3ff);
      filter: blur(4px);
      opacity: 0.85;
      animation: rotateRing 6s linear infinite;
    }

    @property --angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    @keyframes rotateRing {
      to { --angle: 360deg; }
    }

    /* Main High-Clarity Glass Globe */
    .globe-core {
      position: relative;
      width: 310px;
      height: 310px;
      border-radius: 50%;
      background-image: url('assets/stacky_globe_improved.png');
      background-size: cover;
      background-position: center;
      box-shadow: 
        inset 0 0 40px rgba(0, 243, 255, 0.6),
        inset 0 0 80px rgba(255, 0, 127, 0.4),
        0 15px 50px rgba(0, 0, 0, 0.7),
        0 0 60px rgba(0, 243, 255, 0.5),
        0 0 110px rgba(255, 0, 127, 0.4);
      animation: floatBreath 3s ease-in-out infinite alternate;
      z-index: 2;
    }

    /* Expanding Sonic Ripples (Voice Listening Radar) */
    .sonic-ripple {
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 2px solid rgba(0, 243, 255, 0.9);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.8), inset 0 0 20px rgba(255, 0, 127, 0.7);
      pointer-events: none;
      z-index: 3;
      opacity: 0;
      animation: rippleExpand 2.4s cubic-bezier(0.1, 0.75, 0.25, 1) infinite;
    }
    .sonic-ripple:nth-child(2) { animation-delay: 0.8s; }
    .sonic-ripple:nth-child(3) { animation-delay: 1.6s; }

    @keyframes floatBreath {
      0% {
        transform: translateY(0px) scale(1);
        filter: brightness(1.05) contrast(1.1);
      }
      100% {
        transform: translateY(-8px) scale(1.04);
        filter: brightness(1.25) contrast(1.15) drop-shadow(0 0 35px rgba(0, 243, 255, 0.9));
      }
    }

    @keyframes ambientPulse {
      0% { opacity: 0.55; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1.18); }
    }

    @keyframes rippleExpand {
      0% {
        width: 60px;
        height: 60px;
        opacity: 0.95;
        transform: scale(0.5);
      }
      100% {
        width: 360px;
        height: 360px;
        opacity: 0;
        transform: scale(1.25);
      }
    }

    /* Refined Apple-Style Status Typography */
    .status-badge {
      margin-top: 45px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #e0f7ff;
      text-shadow: 0 0 15px rgba(0, 243, 255, 0.8);
      background: rgba(4, 16, 36, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 8px 20px;
      border-radius: 30px;
      border: 1px solid rgba(0, 243, 255, 0.35);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      z-index: 10;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #00f3ff;
      box-shadow: 0 0 12px #00f3ff;
      animation: dotGlow 1.2s infinite;
    }
    @keyframes dotGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.4; }
    }

    .sub-hint {
      margin-top: 10px;
      font-size: 11px;
      color: #62829d;
      letter-spacing: 2px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="orb-wrapper" id="orbBtn">
    <div class="prismatic-ring"></div>
    <div class="globe-core"></div>
    
    <!-- Ultra-Smooth Sonic Voice Waves -->
    <div class="sonic-ripple"></div>
    <div class="sonic-ripple"></div>
    <div class="sonic-ripple"></div>
  </div>

  <div class="status-badge">
    <div class="status-dot"></div>
    <span id="statusLabel">STACKY // LISTENING, SIR</span>
  </div>

  <div class="sub-hint">CLICK GLOBE OR SPEAK DIRECTLY</div>

  <script>
    const orb = document.getElementById("orbBtn");
    const statusLabel = document.getElementById("statusLabel");

    let active = false;
    orb.addEventListener("click", () => {
      active = !active;
      if (active) {
        statusLabel.textContent = "STACKY // PROCESSING INBOXES...";
        setTimeout(() => {
          statusLabel.textContent = "STACKY // ALL CLEAR, SIR";
        }, 2500);
      } else {
        statusLabel.textContent = "STACKY // LISTENING, SIR";
      }
    });
  </script>
</body>
</html>
